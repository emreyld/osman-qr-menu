<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riso Afiş</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{
  --cream:#F7F2E3; --cream-2:#EFE7D2; --paper:#FFFDF6;
  --red:#EE3F2B; --red-dk:#B62A1A; --blue:#2646AE; --blue-dk:#172F7C;
  --ink:#151210; --ink-2:#4A423A; --muted:#8A8070;
  --display:"Bebas Neue",Impact,sans-serif;
  --body:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"Space Mono",ui-monospace,monospace;
  --halft:radial-gradient(circle at 1px 1px,currentColor 1.3px,transparent 1.7px);
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:400;line-height:.88;letter-spacing:.015em;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.sheetw{max-width:760px;margin:0 auto;padding-inline:16px}

/* çift baskı */
.over{position:relative;display:inline-block}
.over .a{display:block;color:var(--red)}
.over .b{position:absolute;inset:0;color:var(--blue);transform:translate(4px,4px);mix-blend-mode:multiply;pointer-events:none}
.dots{background-image:var(--halft);background-size:6px 6px}

/* ---------- logo ---------- */
.lk{display:block;text-align:center;line-height:1}
.lk-orn{display:block;color:var(--blue)}
.lk-word{display:flex;align-items:flex-start;justify-content:center;gap:5px;margin-top:8px}
.lk-main{font-family:var(--display);font-size:3.4em;color:var(--ink)}
.lk-stack{display:flex;flex-direction:column;gap:0;padding-top:.22em}
.lk-stack i{font-style:normal;font-family:var(--display);font-size:.78em;color:var(--ink)}
.lk-since{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:9px;font-family:var(--mono);font-size:.44em;font-weight:700;letter-spacing:.14em;color:var(--red)}
.lk-since i{display:block;width:20px;height:2px;background:var(--red)}
.lk-sub{display:block;margin-top:9px;font-family:var(--mono);font-size:.4em;font-weight:700;letter-spacing:.1em;color:var(--blue)}

/* ---------- üst ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--cream);border-bottom:3px solid var(--ink)}
.top-in{display:flex;align-items:center;gap:11px;max-width:760px;margin:0 auto;padding:8px 16px}
.top .cr{color:var(--red);display:flex;flex:none}
.top .tt{flex:1;font-family:var(--display);font-size:19px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langs{display:flex;gap:4px;flex:none}
.langs button{width:32px;height:30px;font-family:var(--mono);font-size:11px;font-weight:700;border:2px solid var(--ink);line-height:1}
.langs button[aria-pressed=true]{background:var(--blue);color:var(--cream);border-color:var(--blue)}

/* ---------- afiş ---------- */
.poster{position:relative;overflow:hidden;border-bottom:3px solid var(--ink);padding-block:30px 26px}
.poster .field{position:absolute;inset:0;color:var(--blue);opacity:.16;pointer-events:none;
  background-image:var(--halft);background-size:7px 7px;
  -webkit-mask-image:radial-gradient(120% 90% at 50% 0%,#000 20%,transparent 78%);
  mask-image:radial-gradient(120% 90% at 50% 0%,#000 20%,transparent 78%)}
.poster .stack{text-align:center;position:relative}
.poster .big{font-size:clamp(46px,17vw,128px);line-height:.82}
.poster .big .a{letter-spacing:.005em}
.poster .sub{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:16px;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.poster .sub i{height:2px;width:min(18%,58px);background:var(--red)}
.poster .marks{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:20px;position:relative}
.stkr{
  font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  border:2.5px solid var(--ink);background:var(--paper);padding:5px 10px;
}
.stkr.r{background:var(--red);color:var(--cream);border-color:var(--ink);transform:rotate(-2.2deg)}
.stkr.b{background:var(--blue);color:var(--cream);border-color:var(--ink);transform:rotate(1.6deg)}
.poster .crest{display:flex;justify-content:center;color:var(--red);margin-bottom:6px;position:relative}

/* ---------- araçlar ---------- */
.tools{position:sticky;top:48px;z-index:35;background:var(--cream);border-bottom:3px solid var(--ink);padding-block:10px}
.seek{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);background:var(--paper);padding:0 12px}
.seek svg{color:var(--blue);flex:none}
.seek input{flex:1;background:none;border:0;font:inherit;font-family:var(--mono);font-size:14.5px;color:var(--ink);padding:11px 0;min-width:0}
.seek input::placeholder{color:var(--muted);letter-spacing:.06em}
.seek .clr{font-size:19px;line-height:1;width:26px;height:26px;color:var(--muted)}
.seek .clr[hidden]{display:none}
.rail{display:flex;gap:5px;overflow-x:auto;margin-top:9px;scrollbar-width:none;padding-bottom:2px}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:none;font-family:var(--display);font-size:16px;letter-spacing:.04em;padding:5px 11px;border:2.5px solid var(--ink);background:var(--paper);white-space:nowrap;min-height:34px;line-height:1.35}
.rail button[aria-pressed=true]{background:var(--red);color:var(--cream)}
.rail button:nth-child(even)[aria-pressed=true]{background:var(--blue)}

/* ---------- kategori ---------- */
.reel{scroll-margin-top:146px;padding-block:26px 0}
.strip{position:relative;overflow:hidden;border:3px solid var(--ink);background:var(--red);color:var(--cream);padding:12px 14px;display:flex;align-items:center;gap:12px}
.reel:nth-of-type(even) .strip{background:var(--blue)}
.strip .halft{position:absolute;inset:0;color:#fff;opacity:.2;background-image:var(--halft);background-size:6px 6px;pointer-events:none}
.strip h2{flex:1;font-size:clamp(24px,7.4vw,40px);position:relative}
.strip .no{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.1em;opacity:.8;position:relative}
.strip .art{flex:none;position:relative;--d-fill:rgba(255,255,255,.22);--d-line:#fff}

.grid{display:grid;gap:9px;margin-top:9px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.ticket{
  position:relative;display:flex;flex-direction:column;gap:6px;width:100%;text-align:start;
  background:var(--paper);border:2.5px solid var(--ink);padding:13px 14px 11px;
}
.ticket::after{content:"";position:absolute;inset-inline:10px;bottom:38px;border-top:2px dashed rgba(21,18,16,.25)}
.ticket:hover{background:#fff;box-shadow:4px 4px 0 var(--ink)}
.ticket .nm{font-family:var(--display);font-size:22px;letter-spacing:.02em;line-height:1.02}
.ticket .ds{font-size:13px;color:var(--ink-2);line-height:1.45}
.ticket .ft{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto;padding-top:14px}
.ticket .pr{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--red);white-space:nowrap}
.reel:nth-of-type(even) .ticket .pr{color:var(--blue)}
.ticket .pr.ask{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.bs{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.bdg{font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border:2px solid var(--ink);padding:1px 5px}
.bdg.hot{background:var(--red);color:var(--cream)}
.bdg.chef{background:#FFD400}
.kcal{font-family:var(--mono);font-size:10.5px;font-weight:700;color:var(--muted)}
.empty{padding:70px 0;text-align:center;font-family:var(--display);font-size:26px;color:var(--muted)}

/* ---------- alt ---------- */
.foot{margin-top:34px;background:var(--ink);color:var(--cream);padding-block:30px 40px;border-top:3px solid var(--ink)}
.foot h3{font-size:36px;color:var(--red)}
.rows{display:grid;gap:14px;margin-top:16px}
.rows p{margin:0;font-size:15px;color:#D8CFBE;line-height:1.5}
.rows b{display:block;font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#8A8070;margin-bottom:2px}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px;margin-top:22px}
.acts a{display:flex;align-items:center;justify-content:center;min-height:54px;border:3px solid var(--cream);text-decoration:none;font-family:var(--display);font-size:18px;letter-spacing:.05em;text-align:center;padding:0 10px}
.acts a:hover{background:var(--cream);color:var(--ink)}
.acts a.solid{background:var(--red);border-color:var(--red)}
.acts a.solid:hover{background:var(--cream);border-color:var(--cream);color:var(--ink)}
.note{margin-top:22px;font-size:11.5px;color:#8A8070;line-height:1.7}

/* ---------- detay ---------- */
.sheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.sheet{align-items:center}}
.sheet .bd{position:absolute;inset:0;background:rgba(21,18,16,.74)}
.card{position:relative;width:100%;max-width:470px;max-height:88vh;overflow-y:auto;background:var(--paper);border:3px solid var(--ink);border-bottom:0;padding:0 0 26px}
@media(min-width:640px){.card{border-bottom:3px solid var(--ink);box-shadow:8px 8px 0 var(--red)}}
.card .x{position:absolute;inset-inline-end:11px;top:11px;width:36px;height:36px;border:2.5px solid var(--ink);background:var(--paper);font-size:18px;font-weight:700;line-height:1;z-index:3}
.card .head{position:relative;overflow:hidden;background:var(--red);color:var(--cream);padding:18px 18px 16px;border-bottom:3px solid var(--ink)}
.card .head .halft{position:absolute;inset:0;color:#fff;opacity:.2;background-image:var(--halft);background-size:6px 6px}
.card .ct{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;position:relative}
.card h3{font-size:30px;margin:7px 0 0;padding-inline-end:44px;position:relative}
.card .pad{padding:18px 18px 0}
.card .ds{font-size:14.5px;color:var(--ink-2);line-height:1.6}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
.meta div{border:2.5px solid var(--ink);padding:10px 12px}
.meta div:last-child{grid-column:1/-1}
.meta span{display:block;font-family:var(--mono);font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.meta b{display:block;font-family:var(--mono);font-size:19px;margin-top:5px;color:var(--blue)}
.meta b.al{font-family:var(--body);font-size:14px;font-weight:700;color:var(--ink);line-height:1.4}
.warn{margin-top:16px;font-size:11px;color:var(--muted);line-height:1.6;padding-inline:18px}
</style>

<header class="top"><div class="top-in">
  <span class="cr" id="topCrest"></span>
  <span class="tt">Osman Gourmet Beydağı</span>
  <nav class="langs" id="langs" aria-label="Language"></nav>
</div></header>

<section class="poster">
  <span class="field" aria-hidden="true"></span>
  <div class="sheetw">
    <span class="crest" id="crest"></span>
    <div class="stack">
      <h1 class="big over"><span class="a">OSMAN<br>GOURMET</span><span class="b" aria-hidden="true">OSMAN<br>GOURMET</span></h1>
      <p class="sub"><i></i><span>Beydağı · Since 2008</span><i></i></p>
    </div>
    <div class="marks">
      <span class="stkr r">★ 4,7 / 5</span>
      <span class="stkr">1.250 <span id="rv"></span></span>
      <span class="stkr b">08:00 — 02:00</span>
      <span class="stkr" id="cnt"></span>
    </div>
  </div>
</section>

<div class="tools"><div class="sheetw">
  <label class="seek">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off" aria-label="Search">
    <button class="clr" id="clr" type="button" hidden aria-label="Clear">×</button>
  </label>
  <nav class="rail" id="rail" aria-label="Categories"></nav>
</div></div>

<main class="sheetw" id="list"></main>

<footer class="foot"><div class="sheetw">
  <h3 id="infoT"></h3>
  <div class="rows">
    <p><b id="lAdr"></b>Binbirdirek, Klodfarer Cd. No:27/B<br>34122 Fatih / İstanbul</p>
    <p><b id="lTel"></b>(0212) 638 34 44</p>
    <p><b id="lHrs"></b><span id="hrs"></span></p>
  </div>
  <div class="acts" id="acts"></div>
  <p class="note" id="footnote"></p>
</div></footer>

<div class="sheet" id="sheet" hidden>
  <div class="bd" data-close></div>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="shName">
    <button class="x" data-close aria-label="Close">×</button>
    <div class="head" id="shHead">
      <span class="halft"></span>
      <p class="ct" id="shCat"></p>
      <h3 id="shName"></h3>
    </div>
    <div class="pad">
      <p class="ds" id="shDesc"></p>
      <div class="meta" id="shMeta"></div>
    </div>
    <p class="warn" id="shWarn"></p>
  </div>
</div>

<script src="../data/menu-data.js"></script>
<script src="../lib/core.js"></script>
<script src="../lib/brand.js"></script>
<script>
(function(){
  Q.init();
  var V=window.VENUE, filter="", active="";
  document.getElementById("topCrest").innerHTML=Brand.crest(22);
  document.getElementById("crest").innerHTML=Brand.crest(46);

  var lw=document.getElementById("langs");
  window.LANGS.forEach(function(l){
    var b=document.createElement("button");
    b.type="button"; b.textContent=l.short; b.setAttribute("lang",l.code);
    b.onclick=function(){Q.setLang(l.code)};
    lw.appendChild(b);
  });

  function rail(){
    var c=document.getElementById("rail"); c.innerHTML="";
    var a=document.createElement("button");
    a.type="button"; a.textContent=Q.t("all"); a.setAttribute("aria-pressed",active==="");
    a.onclick=function(){active="";rail();render();window.scrollTo({top:0,behavior:"smooth"})};
    c.appendChild(a);
    window.MENU.forEach(function(cat){
      var b=document.createElement("button");
      b.type="button"; b.textContent=Q.L(cat.n); b.setAttribute("aria-pressed",active===cat.id);
      b.onclick=function(){
        active=(active===cat.id?"":cat.id); rail(); render();
        var el=document.getElementById("r-"+cat.id);
        if(el) el.scrollIntoView({behavior:"smooth",block:"start"});
      };
      c.appendChild(b);
    });
  }

  function render(){
    var data=Q.search(filter);
    if(active) data=data.filter(function(c){return c.id===active});
    var out="";
    if(!data.length) out='<p class="empty">'+Q.esc(Q.t("empty"))+'</p>';
    data.forEach(function(cat){
      var n=window.MENU.map(function(c){return c.id}).indexOf(cat.id)+1;
      out+='<section class="reel" id="r-'+cat.id+'">'+
        '<div class="strip"><span class="halft"></span>'+
        '<h2>'+Q.esc(Q.L(cat.n))+'</h2>'+
        '<span class="no">'+(n<10?"0"+n:n)+' / '+cat.items.length+'</span>'+
        '<span class="art">'+Brand.dish(Brand.dishFor(cat.id),44)+'</span></div><div class="grid">';
      cat.items.forEach(function(it){
        var bs="";
        (it.t||[]).forEach(function(tg){
          var cls=tg==="spicy"?" hot":(tg==="chef"?" chef":"");
          bs+='<span class="bdg'+cls+'">'+Q.esc(Q.tag(tg))+'</span>';
        });
        if(it.k) bs+='<span class="kcal">'+it.k+'kcal</span>';
        out+='<button class="ticket" type="button" data-id="'+it._id+'">'+
          '<span class="nm">'+Q.esc(Q.L(it.i))+'</span>'+
          (it.d?'<span class="ds">'+Q.esc(Q.L(it.d))+'</span>':'')+
          '<span class="ft"><span class="bs">'+bs+'</span>'+
          '<span class="pr'+(it.p===null?' ask':'')+'">'+Q.esc(Q.price(it.p))+'</span></span>'+
          '</button>';
      });
      out+='</div></section>';
    });
    document.getElementById("list").innerHTML=out;
  }

  function texts(){
    document.getElementById("rv").textContent=Q.t("reviews");
    document.getElementById("cnt").textContent=Q.count()+" "+Q.t("items");
    document.getElementById("hrs").textContent=Q.L(V.hours);
    document.getElementById("q").placeholder=Q.t("search");
    document.getElementById("infoT").textContent=Q.t("info");
    document.getElementById("lAdr").textContent=Q.t("address");
    document.getElementById("lTel").textContent=Q.t("phone");
    document.getElementById("lHrs").textContent=Q.t("hours");
    document.getElementById("footnote").textContent=Q.t("calNote")+" "+Q.t("allergenNote");
    document.getElementById("acts").innerHTML=
      '<a class="solid" href="tel:'+V.phone.replace(/\s/g,"")+'">'+Q.esc(Q.t("call"))+'</a>'+
      '<a href="'+V.directions+'" target="_blank" rel="noopener">'+Q.esc(Q.t("directions"))+'</a>'+
      '<a href="https://wa.me/'+V.whatsapp+'" target="_blank" rel="noopener">'+Q.esc(Q.t("whatsapp"))+'</a>'+
      '<a href="'+V.reservation+'" target="_blank" rel="noopener">'+Q.esc(Q.t("reserve"))+'</a>';
    Array.prototype.forEach.call(lw.children,function(b,i){
      b.setAttribute("aria-pressed", window.LANGS[i].code===Q.lang);
    });
  }

  var sheet=document.getElementById("sheet");
  function open(id){
    var it=Q.find(id); if(!it) return;
    var idx=window.MENU.map(function(c){return c.id}).indexOf(it._cat.id);
    document.getElementById("shHead").style.background=(idx%2===1)?"var(--blue)":"var(--red)";
    document.getElementById("shCat").textContent=Q.L(it._cat.n);
    document.getElementById("shName").textContent=Q.L(it.i);
    var d=document.getElementById("shDesc");
    d.textContent=it.d?Q.L(it.d):""; d.style.display=it.d?"":"none";
    var al=(it.a&&it.a.length)?it.a.map(Q.allergen).join(" · "):Q.t("noAllergen");
    document.getElementById("shMeta").innerHTML=
      '<div><span>'+Q.esc(Q.t("menu"))+'</span><b>'+Q.esc(Q.price(it.p))+'</b></div>'+
      '<div><span>'+Q.esc(Q.t("kcal"))+'</span><b>'+(it.k?"~"+it.k:"—")+'</b></div>'+
      '<div><span>'+Q.esc(Q.t("allergens"))+'</span><b class="al">'+Q.esc(al)+'</b></div>';
    document.getElementById("shWarn").textContent=Q.t("calNote")+" "+Q.t("allergenNote");
    sheet.hidden=false; document.body.style.overflow="hidden";
    sheet.querySelector(".x").focus();
  }
  function close(){ sheet.hidden=true; document.body.style.overflow=""; }
  sheet.addEventListener("click",function(e){ if(e.target.closest("[data-close]")) close(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape"&&!sheet.hidden) close(); });
  document.getElementById("list").addEventListener("click",function(e){
    var b=e.target.closest(".ticket"); if(b) open(b.dataset.id);
  });
  var qi=document.getElementById("q"), clr=document.getElementById("clr");
  qi.addEventListener("input",function(e){ filter=e.target.value; active=""; clr.hidden=!filter; rail(); render(); });
  clr.addEventListener("click",function(){ qi.value=""; filter=""; clr.hidden=true; rail(); render(); qi.focus(); });

  Q.onLang(function(){ texts(); rail(); render(); });
  texts(); rail(); render();
})();
</script>
